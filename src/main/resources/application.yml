server:
  port: 8080

spring:
  application:
    name: visit-subsystem
  datasource:
    url: jdbc:h2:file:./data/visitdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
