server:
  port: 8080

spring:
  application:
    name: visit-subsystem
  datasource:
    url: jdbc:h2:file:./data/visitdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

visit:
  compliance:
    min-duration-seconds: 300
    max-hospital-distance-meters: 500.0
  # Zone used for month bucketing and displaying timestamps (UTC+8).
  time-zone: Asia/Shanghai
